name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: make check
      - name: Build packages
        run: make build
      - name: Embedded caster integration test
        run: go test -race -tags=integration ./ntrip -run 'TestEmbeddedCaster.*EndToEnd' -count=1 -timeout=20s
